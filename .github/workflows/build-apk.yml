name: Build SHIV Media Editor APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiv-media-editor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: SHIV Media Editor v1.0.0 Build ${{ github.run_number }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
          body: |
            ## 🎬 SHIV Media Editor — Official Android Release
            
            - **Build**: #${{ github.run_number }}
            - **Platform**: Android 8.0+ (API 26+)
            - **Features**:
              - Mandatory SHIV Identity authentication
              - Video Studio with multi-track timeline, chroma key & filters
              - Photo Studio with AI subject isolation
              - Audio Studio with waveforms & Edge-TTS voiceover
              - Motion Graphics & Lower Thirds engine
              - Editable social templates library (Reels, Shorts, YouTube)
              - Native SHIV AI Copilot integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
